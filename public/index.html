<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>札幌こそだてX投稿ジェネレーター</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      padding: 1.25rem 1rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(37,99,235,.3);
    }
    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .02em; }
    header p { font-size: .8rem; margin-top: .25rem; opacity: .85; }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    /* Input section */
    .input-section label {
      display: block;
      font-weight: 600;
      font-size: .9rem;
      margin-bottom: .5rem;
      color: #374151;
    }
    .input-row {
      display: flex;
      gap: .5rem;
    }
    .input-row input {
      flex: 1;
      padding: .6rem .85rem;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      font-size: .9rem;
      transition: border-color .2s;
      outline: none;
    }
    .input-row input:focus { border-color: #2563eb; }
    .input-row input::placeholder { color: #9ca3af; }

    .btn {
      padding: .6rem 1.1rem;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
      width: 100%;
      margin-top: .75rem;
    }
    .btn-secondary:hover { background: #d1d5db; }

    .hint {
      font-size: .75rem;
      color: #6b7280;
      margin-top: .5rem;
    }

    /* Status */
    .status {
      display: none;
      align-items: center;
      gap: .6rem;
      padding: .8rem 1rem;
      border-radius: 8px;
      font-size: .875rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    .status.loading {
      display: flex;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .status.success {
      display: flex;
      background: #f0fdf4;
      color: #166534;
    }
    .status.error {
      display: flex;
      background: #fef2f2;
      color: #991b1b;
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 3px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Source info */
    .source-info {
      font-size: .78rem;
      color: #6b7280;
      padding: .5rem .75rem;
      background: #f9fafb;
      border-radius: 6px;
      margin-bottom: 1rem;
      word-break: break-all;
      display: none;
    }
    .source-info strong { color: #374151; }

    /* Post cards */
    .post-card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: .875rem;
      transition: box-shadow .2s;
    }
    .post-card:hover { box-shadow: 0 2px 8px rgba(37,99,235,.1); }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .6rem;
    }
    .post-label {
      font-weight: 700;
      font-size: .85rem;
      color: #2563eb;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .char-count {
      font-size: .78rem;
      color: #6b7280;
      font-variant-numeric: tabular-nums;
    }
    .char-count.over { color: #dc2626; font-weight: 700; }

    .btn-copy {
      padding: .3rem .65rem;
      border: 1.5px solid #2563eb;
      border-radius: 6px;
      background: #fff;
      color: #2563eb;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-copy:hover { background: #2563eb; color: #fff; }
    .btn-copy.copied { background: #16a34a; border-color: #16a34a; color: #fff; }

    .post-body {
      font-size: .9rem;
      line-height: 1.65;
      color: #1f2937;
      word-break: break-word;
    }
    .post-body .hashtag { color: #2563eb; }

    /* Results hidden initially */
    #results { display: none; }

    @media (max-width: 500px) {
      header h1 { font-size: 1.1rem; }
      .input-row { flex-direction: column; }
      .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🐣 札幌こそだてX投稿ジェネレーター</h1>
    <p>URLを入力して、子連れ向けX投稿案を自動生成します</p>
  </header>

  <main>
    <!-- Input -->
    <div class="card input-section">
      <label for="url-input">イベント・スポットのURLを入力してください</label>
      <div class="input-row">
        <input
          id="url-input"
          type="url"
          placeholder="https://example.com/event/..."
          autocomplete="off"
          spellcheck="false"
        >
        <button id="generate-btn" class="btn btn-primary" onclick="generate()">生成する</button>
      </div>
      <p class="hint">※ JavaScriptで動的に生成されるページは取得できない場合があります</p>
    </div>

    <!-- Status -->
    <div id="status" class="status" role="status" aria-live="polite">
      <div id="status-icon"></div>
      <span id="status-text"></span>
    </div>

    <!-- Results -->
    <div id="results">
      <div id="source-info" class="source-info"></div>
      <div id="posts-container"></div>
      <button class="btn btn-secondary" onclick="regenerate()">再生成する</button>
    </div>
  </main>

  <script>
    let lastUrl = '';

    function setStatus(type, text) {
      const el = document.getElementById('status');
      const icon = document.getElementById('status-icon');
      const textEl = document.getElementById('status-text');

      el.className = 'status ' + type;
      textEl.textContent = text;

      if (type === 'loading') {
        icon.innerHTML = '<div class="spinner"></div>';
      } else if (type === 'success') {
        icon.textContent = '✅';
      } else if (type === 'error') {
        icon.textContent = '❌';
      }
    }

    function hideStatus() {
      document.getElementById('status').className = 'status';
    }

    function countChars(text) {
      return [...text].length;
    }

    function highlightHashtags(text) {
      return text.replace(/(#\S+)/g, '<span class="hashtag">$1</span>');
    }

    function renderPosts(posts) {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';

      posts.forEach((post, i) => {
        const count = countChars(post.body);
        const isOver = count > 140;

        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <div class="post-header">
            <span class="post-label">投稿${i + 1}</span>
            <div class="post-meta">
              <span class="char-count${isOver ? ' over' : ''}" id="count-${i}">文字数: ${count}</span>
              <button class="btn-copy" id="copy-${i}" onclick="copyPost(${i})">📋 コピー</button>
            </div>
          </div>
          <div class="post-body">${highlightHashtags(escapeHtml(post.body))}</div>
        `;
        container.appendChild(card);
      });

      // Store posts for copy
      window._posts = posts;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function copyPost(index) {
      const body = window._posts[index].body;
      const btn = document.getElementById('copy-' + index);
      try {
        await navigator.clipboard.writeText(body);
        btn.textContent = '✅ コピー済み';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 コピー';
          btn.classList.remove('copied');
        }, 2000);
      } catch {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = body;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btn.textContent = '✅ コピー済み';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 コピー';
          btn.classList.remove('copied');
        }, 2000);
      }
    }

    async function generate(url) {
      url = url || document.getElementById('url-input').value.trim();

      if (!url) {
        setStatus('error', 'URLを入力してください');
        return;
      }

      lastUrl = url;

      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      document.getElementById('results').style.display = 'none';
      setStatus('loading', '投稿案を生成中です...');

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 60000);

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
          signal: controller.signal,
        });

        clearTimeout(timeout);
        const data = await res.json();

        if (!data.success) {
          setStatus('error', data.error || '生成に失敗しました');
          return;
        }

        setStatus('success', `投稿案が${data.posts.length}件生成されました`);

        const sourceEl = document.getElementById('source-info');
        if (data.source && data.source.title) {
          sourceEl.style.display = 'block';
          sourceEl.innerHTML = `<strong>取得元：</strong>${escapeHtml(data.source.title)}`;
        } else {
          sourceEl.style.display = 'none';
        }

        renderPosts(data.posts);
        document.getElementById('results').style.display = 'block';

      } catch (err) {
        clearTimeout(timeout);
        if (err.name === 'AbortError') {
          setStatus('error', 'タイムアウトしました。再試行してください');
        } else {
          setStatus('error', '通信エラーが発生しました。再試行してください');
        }
      } finally {
        btn.disabled = false;
      }
    }

    function regenerate() {
      generate(lastUrl);
    }

    // Allow Enter key to submit
    document.getElementById('url-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
